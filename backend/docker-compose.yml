version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vault_postgres
    environment:
      POSTGRES_DB: credentials_vault
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_password_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Uncomment to run the server in Docker too
  # server:
  #   build: ./server
  #   container_name: vault_server
  #   ports:
  #     - "5000:5000"
  #   env_file:
  #     - ./server/.env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data: